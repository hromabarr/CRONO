name: Compilar

# Se lanza a mano desde la pestaña Actions. No se compila en cada push: los
# minutos de runner macOS son caros y esto solo hace falta cuando quieres
# instalar una versión nueva o ver cómo ha quedado.
on:
  workflow_dispatch:
    inputs:
      capturas:
        description: "Generar capturas del simulador"
        type: boolean
        default: true
      ipa:
        description: "Generar el .ipa para instalar en el móvil"
        type: boolean
        default: true

env:
  BUNDLE_ID: com.xilgar.crono

jobs:
  # ─────────────────────────────────────────────────────────────
  # Tests. Se ejecutan siempre y bloquean lo demás: si la lógica de
  # rachas está rota, no tiene sentido producir un .ipa ni capturas.
  # ─────────────────────────────────────────────────────────────
  test:
    runs-on: macos-latest
    timeout-minutes: 25
    outputs:
      simulator: ${{ steps.sim.outputs.udid }}

    steps:
      - uses: actions/checkout@v5

      # Nunca falla: solo deja en el log qué SDK hay, para que si el build
      # peta por la versión de iOS sepas de un vistazo por qué.
      - name: Entorno disponible
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir un simulador disponible
        id: sim
        run: |
          # No se fija "iPhone 16" a pelo: el catálogo de simuladores cambia
          # con cada imagen del runner y un nombre inventado rompe el build.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | .[-1].udid')
          NAME=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | .[-1].name')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No hay simuladores de iPhone en este runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Usando $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # El runner reutiliza el mismo simulador entre ejecuciones, así que el
      # contenedor de la app sobrevive. Un almacén de SwiftData creado con un
      # esquema anterior no se puede abrir sin plan de migración, y el fallo
      # aparece como un error de CoreData que no tiene nada que ver con el
      # cambio que estés probando.
      - name: Desinstalar la app del simulador
        run: |
          xcrun simctl uninstall "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID" 2>/dev/null \
            || echo "No estaba instalada; nada que borrar."

      - name: Ejecutar los tests
        run: |
          # `pipefail` es imprescindible: sin él, el `tee` devolvería 0 y el
          # paso pasaría por bueno aunque xcodebuild hubiera fallado.
          set -o pipefail
          xcodebuild test \
            -project Crono.xcodeproj \
            -scheme Crono \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      # El log de xcodebuild son miles de líneas y GitHub solo anota
      # «exit code 65», que no dice nada. Esto extrae lo único que importa
      # para poder arreglarlo sin tener que bucear en el log entero.
      # El diagnóstico se publica en tres sitios para que no haya que bucear en
      # el log: como anotaciones de GitHub (aparecen arriba en la página del
      # run), como resumen del job (una página propia) y en la consola.
      - name: Resumen de errores
        if: failure()
        run: |
          ROOT="/Users/runner/work/CRONO/CRONO/"

          # ── Anotaciones: un error por línea, con archivo y número de línea ──
          awk -v root="$ROOT" '
            /\.swift:[0-9]+:[0-9]+: error: /{
              line = $0
              sub(root, "", line)
              split(line, part, ":")
              idx = index(line, "error: ")
              msg = substr(line, idx + 7)
              key = part[1] ":" part[2] ":" msg
              if (!seen[key]++) printf "::error file=%s,line=%s::%s\n", part[1], part[2], msg
            }
          ' xcodebuild.log | head -40

          # Solo diagnósticos del compilador y del enlazador. El filtro es
          # estrecho a propósito: un `grep "error: "` a secas captura también las
          # líneas `[error] CoreData: error:` que la app emite al ejecutarse, y
          # esas decenas de líneas de runtime ahogan el fallo real.
          errores=$(grep -E "^[^ ]*\.swift:[0-9]+:[0-9]+: error: |^(ld|clang|swiftc): error: |^error: " \
            xcodebuild.log | sed "s|$ROOT||" | sort -u | head -60)

          # Fallos de test, que no llevan la forma archivo:línea: error:
          fallos=$(grep -E "Test Case .* failed|✘ |Issue recorded|XCTAssert.* failed|error: -\[" \
            xcodebuild.log | sed "s|$ROOT||" | sort -u | head -40)

          # Fallos que no son ni de compilación ni de aserción: la app o el
          # runner se caen, el simulador no arranca, se agota el tiempo.
          caidas=$(grep -E "crashed|Early unexpected exit|did not finish|Failed to (install|launch)|Unable to (boot|lookup)|Timed out|Lost connection|Fatal error" \
            xcodebuild.log | sed "s|$ROOT||" | sort -u | head -25)

          # Las banderas -warn-long-* nombran cada función y expresión que pasa
          # de 200 ms. Ordenarlas por milisegundos señala dónde se atasca el
          # inferidor, en lugar de tener que deducirlo.
          lentas=$(grep -oE "[^ ]+\.swift:[0-9]+:[0-9]+: warning: [^:]*took [0-9]+ms to type-check" \
            xcodebuild.log | sed "s|$ROOT||" | sort -u \
            | sed -E 's/.*took ([0-9]+)ms.*/\1 &/' | sort -rn | cut -d' ' -f2- | head -25)

          # ── Resumen del job ──
          {
            echo "## Errores de compilación"
            echo '```'
            echo "${errores:-(ninguno — el proyecto compila)}"
            echo '```'
            echo "## Fallos de test"
            echo '```'
            echo "${fallos:-(ninguno)}"
            echo '```'
            echo "## Caídas y problemas del entorno"
            echo '```'
            echo "${caidas:-(ninguna)}"
            echo '```'
            echo "## Lo más lento de comprobar tipos"
            echo '```'
            echo "${lentas:-(ninguna)}"
            echo '```'

            # Red de seguridad: si ningún filtro encuentra nada, el resumen
            # saldría vacío y no diría por qué ha fallado el trabajo. Con la cola
            # del log siempre hay algo por donde empezar.
            if [ -z "$errores$fallos$caidas$lentas" ]; then
              echo "## Ningún filtro encontró nada — cola del log"
              echo "El fallo no encaja en las categorías de arriba."
              echo '```'
              tail -80 xcodebuild.log | sed "s|$ROOT||"
              echo '```'
            fi

            echo "El log completo va como artefacto \`log-xcodebuild\`."
          } >> "$GITHUB_STEP_SUMMARY"

          # ── Consola ──
          echo "════════════ ERRORES DE COMPILACIÓN ════════════"
          echo "${errores:-(ninguno)}"
          echo ""
          echo "═══════════════ FALLOS DE TEST ═══════════════"
          echo "${fallos:-(ninguno)}"
          echo ""
          echo "════════════════ CAÍDAS ════════════════"
          echo "${caidas:-(ninguna)}"
          echo ""
          echo "═══════ LO MÁS LENTO DE COMPROBAR TIPOS ═══════"
          echo "${lentas:-(ninguna)}"

      - name: Guardar el log completo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-xcodebuild
          path: xcodebuild.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Capturas reales de la app corriendo en el simulador.
  # ─────────────────────────────────────────────────────────────
  capturas:
    needs: test
    if: inputs.capturas
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Compilar para el simulador
        run: |
          xcodebuild build \
            -project Crono.xcodeproj \
            -scheme Crono \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Arrancar el simulador
        id: boot
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | .[-1].udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Instalar la app
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "No se generó ningún .app."
            exit 1
          fi
          # Desinstalar primero: si queda un almacén de una ejecución anterior,
          # la siembra de datos de ejemplo se salta —solo actúa con la base
          # vacía— y las capturas saldrían con datos viejos o de otro esquema.
          xcrun simctl uninstall "${{ steps.boot.outputs.udid }}" "$BUNDLE_ID" 2>/dev/null || true
          echo "Instalando $APP"
          xcrun simctl install "${{ steps.boot.outputs.udid }}" "$APP"

      - name: Capturar las pantallas
        run: |
          UDID="${{ steps.boot.outputs.udid }}"
          mkdir -p capturas

          for apariencia in light dark; do
            xcrun simctl ui "$UDID" appearance "$apariencia"

            for pestana in today reminders habits alarms; do
              # Terminar antes de relanzar: sin esto, simctl reactiva la
              # instancia existente y los argumentos nuevos se ignoran, así
              # que las tres capturas saldrían de la misma pestaña.
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              sleep 1

              xcrun simctl launch "$UDID" "$BUNDLE_ID" \
                -seedSampleData -startTab "$pestana"

              # Margen para que SwiftData siembre los datos la primera vez y
              # para que terminen las animaciones de entrada.
              sleep 6

              xcrun simctl io "$UDID" screenshot "capturas/${apariencia}-${pestana}.png"
              echo "Capturada ${apariencia}-${pestana}.png"
            done
          done

          ls -lh capturas

      - uses: actions/upload-artifact@v4
        with:
          name: capturas-simulador
          path: capturas/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # .ipa sin firmar, para instalar con Sideloadly.
  # ─────────────────────────────────────────────────────────────
  ipa:
    needs: test
    if: inputs.ipa
    runs-on: macos-latest
    timeout-minutes: 30
    # Para crear la release que lee FlareStore.
    permissions:
      contents: write
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Todo el historial y las etiquetas: las notas de la versión son los
          # commits desde la release anterior.
          fetch-depth: 0

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Compilar sin firmar
        # Sideloadly vuelve a firmar la app con tu Apple ID, así que aquí se
        # compila deliberadamente sin certificado: no hace falta ninguno.
        run: |
          xcodebuild build \
            -project Crono.xcodeproj \
            -scheme Crono \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      # Un .ipa no es más que un zip con la app dentro de una carpeta llamada
      # Payload. Al no estar firmada no sirve `xcodebuild exportArchive`:
      # hay que empaquetarlo a mano.
      - name: Empaquetar el .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "No se generó ningún .app; revisa el paso de compilación."
            exit 1
          fi
          echo "Empaquetando $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/

          # Firma ad hoc solo para dejar escritos los entitlements —el grupo de
          # apps que comparten la app y los widgets—. No sirve para instalar:
          # FlareStore o Sideloadly vuelven a firmar con su certificado, y las
          # herramientas que conservan entitlements los leen de aquí.
          PAYLOAD_APP="Payload/$(basename "$APP")"
          for APPEX in "$PAYLOAD_APP"/PlugIns/*.appex; do
            [ -d "$APPEX" ] || continue
            codesign --force --sign - --entitlements CronoWidgets/CronoWidgets.entitlements "$APPEX"
          done
          codesign --force --sign - --entitlements Crono/Crono.entitlements "$PAYLOAD_APP"
          ls "$PAYLOAD_APP/PlugIns" || echo "Sin extensiones dentro de la app."

          zip -qry Crono-sin-firmar.ipa Payload
          ls -lh Crono-sin-firmar.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Crono-ipa
          path: Crono-sin-firmar.ipa
          retention-days: 30

      # ─────────────────────────────────────────────────────────────
      # Publicación para FlareStore (o cualquier tienda que lea fuentes
      # con el formato de AltStore).
      #
      # Cada compilación de main crea una release con el .ipa y un
      # repo.json que apunta a él. FlareStore se queda con esta dirección
      # fija, que GitHub redirige siempre a la release más reciente:
      #
      #   https://github.com/<usuario>/<repo>/releases/latest/download/repo.json
      #
      # Así no hay que hacer commits desde CI para actualizar la fuente.
      # ─────────────────────────────────────────────────────────────
      - name: Publicar la versión
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          RAW_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          ICON_URL="$RAW_URL/Crono/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          DOWNLOAD_URL="$REPO_URL/releases/download/$TAG/Crono.ipa"

          # Notas: los títulos de los commits desde la release anterior.
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            NOTES=$(git log --no-merges --format='- %s' "$PREVIOUS..HEAD")
          else
            NOTES=$(git log --no-merges --format='- %s' -10)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- Misma versión, compilada de nuevo."
          fi

          cp Crono-sin-firmar.ipa Crono.ipa
          SIZE=$(stat -f%z Crono.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Se rellenan a la vez los campos de versión actuales (`versions`) y
          # los antiguos (`version`, `downloadURL`…): las tiendas derivadas de
          # AltStore no leen todas los mismos.
          jq -n \
            --arg version "$VERSION" \
            --arg build "$BUILD" \
            --arg date "$DATE" \
            --arg notes "$NOTES" \
            --arg download "$DOWNLOAD_URL" \
            --arg icon "$ICON_URL" \
            --arg website "$REPO_URL" \
            --arg bundle "$BUNDLE_ID" \
            --argjson size "$SIZE" \
            '{
              name: "Crono",
              identifier: ($bundle + ".source"),
              subtitle: "Hábitos, tareas y alarmas",
              website: $website,
              iconURL: $icon,
              tintColor: "#344C5C",
              apps: [{
                name: "Crono",
                bundleIdentifier: $bundle,
                developerName: "Xilgar",
                subtitle: "Hábitos, tareas y alarmas",
                localizedDescription: "Hábitos con rutinas de mañana y noche, tareas con avisos y alarmas que no paran hasta que escaneas tu código.",
                iconURL: $icon,
                tintColor: "#344C5C",
                category: "productivity",
                version: $version,
                versionDate: $date,
                versionDescription: $notes,
                downloadURL: $download,
                size: $size,
                versions: [{
                  version: $version,
                  buildVersion: $build,
                  date: $date,
                  localizedDescription: $notes,
                  downloadURL: $download,
                  size: $size,
                  minOSVersion: "26.0"
                }],
                appPermissions: {
                  entitlements: ["com.apple.security.application-groups"],
                  privacy: {
                    NSCameraUsageDescription: "Para leer el código que desarma una alarma.",
                    NSAlarmKitUsageDescription: "Para poner alarmas que suenan aunque el móvil esté en silencio."
                  }
                }
              }],
              news: []
            }' > repo.json

          cat repo.json

          gh release create "$TAG" Crono.ipa repo.json \
            --target "$GITHUB_SHA" \
            --title "Crono $VERSION" \
            --notes "$NOTES"

          {
            echo "### Publicada Crono $VERSION"
            echo
            echo "Fuente para FlareStore: \`$REPO_URL/releases/latest/download/repo.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
