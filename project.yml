name: Crono

options:
  bundleIdPrefix: com.xilgar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: es
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      # Avisa de cada función y cada expresión que tarde más de 200 ms en
      # comprobar tipos, indicando archivo y línea.
      #
      # Es la herramienta correcta para los «unable to type-check this
      # expression in reasonable time»: en lugar de deducir qué expresión es
      # lenta, el compilador las nombra todas, incluidas las que aún no llegan
      # a fallar. Solo en Debug, porque añade trabajo a la compilación.
      OTHER_SWIFT_FLAGS: >-
        -Xfrontend -warn-long-function-bodies=200
        -Xfrontend -warn-long-expression-type-checking=200

targets:
  Crono:
    type: application
    platform: iOS
    sources:
      # Info.plist lo genera XcodeGen a partir del bloque `info`; se excluye de
      # `sources` para que no se copie además como recurso.
      - path: Crono
        excludes:
          - Info.plist
    settings:
      base:
        # El identificador es neutro a propósito: la app crecerá con tareas y
        # alarmas, y cambiarlo más adelante haría que iOS la tratase como una
        # app distinta, borrando el historial y las rachas del usuario.
        PRODUCT_BUNDLE_IDENTIFIER: com.xilgar.crono
        PRODUCT_NAME: Crono
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Crono/Info.plist
      # Los ajustes INFOPLIST_KEY_* de Xcode solo se aplican cuando
      # GENERATE_INFOPLIST_FILE está activo; aquí el plist es explícito, así que
      # las claves van en este bloque.
      properties:
        CFBundleDisplayName: Crono
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        # Obligatoria para AlarmKit. Sin ella, la petición de permiso falla en
        # silencio: no aparece diálogo y el estado se queda en "no determinado",
        # sin error que lo explique.
        NSAlarmKitUsageDescription: >-
          Crono necesita permiso para poner alarmas y despertarte a la hora que
          programes, incluso con el móvil en silencio.
        # Solo retrato en iPhone: la app es una lista vertical, el paisaje no aporta.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  CronoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CronoTests
    dependencies:
      - target: Crono
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xilgar.crono.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Crono:
    build:
      targets:
        Crono: all
        CronoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CronoTests
