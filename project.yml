name: HabitTracker

options:
  bundleIdPrefix: com.xilgar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: es
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  HabitTracker:
    type: application
    platform: iOS
    sources:
      # Info.plist lo genera XcodeGen a partir del bloque `info`; se excluye de
      # `sources` para que no se copie además como recurso.
      - path: HabitTracker
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xilgar.habittracker
        # Sin tilde a propósito: este es el nombre del binario y del bundle
        # (Habitos.app), y hay herramientas de firma y sideload que tropiezan
        # con caracteres no ASCII en la ruta. El nombre que ve el usuario en la
        # pantalla de inicio es CFBundleDisplayName, que sí lleva tilde.
        PRODUCT_NAME: Habitos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: HabitTracker/Info.plist
      # Los ajustes INFOPLIST_KEY_* de Xcode solo se aplican cuando
      # GENERATE_INFOPLIST_FILE está activo; aquí el plist es explícito, así que
      # las claves van en este bloque.
      properties:
        CFBundleDisplayName: Hábitos
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        # Solo retrato en iPhone: la app es una lista vertical, el paisaje no aporta.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  HabitTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HabitTrackerTests
    dependencies:
      - target: HabitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xilgar.habittracker.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HabitTracker:
    build:
      targets:
        HabitTracker: all
        HabitTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HabitTrackerTests
